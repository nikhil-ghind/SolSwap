[package]
name = "sol_swap"
version = "0.1.0"
description = "Constant-product AMM on Solana built with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_swap"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["token"] }
